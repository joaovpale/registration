<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Inscrições para minhas receitas culinárias</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(rgba(9, 21, 58, 0.8), rgba(8, 25, 75, 0.8)),
                  url('https://images.unsplash.com/photo-1523182465265-d4d4bde8a54b') no-repeat center center/cover;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .form-container {
      background-color: rgba(6, 15, 43, 0.8);
      padding: 40px 30px;
      border-radius: 20px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      backdrop-filter: blur(5px);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 26px;
      color: #ffffff;
    }

    span {
      font-weight: bold;
      font-style: italic;
    }

    label {
      display: block;
      margin: 20px 0 5px;
      font-weight: bold;
      color: #dddddd;
    }

    input #whatsapp {
      height: 30px
    }

    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background-color: #ffeaea;
      color: #5e2c2c;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button {
      margin-top: 25px;
      width: 100%;
      padding: 12px;
      font-size: 16px;
      background-color: #dddddd;
      border: none;
      border-radius: 10px;
      color: rgb(6, 15, 43, 0.8);
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #394568;
      color: white;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h1>Formulário apenas para fins de serviços como <span>técnico eletrônico</span></h1>
    <form action="https://formspree.io/f/xvgqgveg" method="POST">

      <label for="nome">Seu nome</label>
      <input type="text" id="nome" name="nome" required>

      <label for="idade">Idade</label>
      <input type="number" id="idade" name="idade" required>

      <label for="sexo">Sexo</label>
      <input type="text" id="sexo" name="sexo" required>

      <label for="bom_de_boca">Qual serviço especificadamente você necessita?</label>
      <textarea id="bom_de_boca" name="bom_de_boca" required></textarea>

      <label for="whatsapp">Digite aqui seu número do Whatsapp, logo te retornarei(apenas para fins profissionais)</label>
      <textarea id="whatsapp" name="whatsapp" required></textarea>

      <button type="submit">Enviar formulário</button>
    </form>
  </div>
</body>
</html>
